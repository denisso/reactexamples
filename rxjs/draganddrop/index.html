<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <div
      id="container"
      style="
        position: relative;
        width: 500px;
        height: 300px;
        border: 1px solid #ccc;
      "
    >
      <div
        id="draggable"
        style="
          position: absolute;
          width: 50px;
          height: 50px;
          background: blue;
          cursor: grab;
        "
      ></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
